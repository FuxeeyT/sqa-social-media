name: CI - Testes Automatizados

on:
  pull_request:
    branches:
      - main

jobs:
  testes-backend:
    name: Testes Backend (JUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permissão ao mvnw
        run: chmod +x api/mvnw

      - name: Rodar testes do backend
        working-directory: ./api
        run: ./mvnw test

  testes-frontend:
    name: Testes Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do cliente
        working-directory: ./client
        run: npm install

      - name: Rodar testes do frontend
        working-directory: ./client
        run: npm test -- --watchAll=false --passWithNoTests || true

  testes-e2e-api:
    name: Testes E2E e API (Playwright)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: sqa_social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dar permissão ao mvnw
        run: chmod +x api/mvnw

      - name: Instalar dependências do cliente
        working-directory: ./client
        run: npm install

      - name: Instalar dependências dos testes
        working-directory: ./tests
        run: npm install

      - name: Instalar navegadores Playwright
        working-directory: ./tests
        run: node node_modules/.bin/playwright install chromium --with-deps

      - name: Criar application.properties da API
        run: |
          cat > api/src/main/resources/application.properties << EOF
          spring.application.name=demo
          spring.datasource.url=jdbc:mysql://localhost:3306/sqa_social_media
          spring.datasource.username=root
          spring.datasource.password=root1234
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=false
          EOF

      - name: Iniciar a API em background
        working-directory: ./api
        run: ./mvnw spring-boot:run &

      - name: Iniciar o cliente em background
        working-directory: ./client
        run: npm run dev &

      - name: Aguardar API subir
        run: |
          echo "Aguardando API na porta 8080..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/posts > /dev/null; then
              echo "API pronta!"
              break
            fi
            echo "Tentativa $i..."
            sleep 5
          done

      - name: Aguardar cliente subir
        run: |
          echo "Aguardando cliente na porta 3000..."
          for i in {1..20}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Cliente pronto!"
              break
            fi
            echo "Tentativa $i..."
            sleep 5
          done

      - name: Rodar testes Playwright (apenas API)
        working-directory: ./tests
        run: node node_modules/.bin/playwright test tests/api --reporter=list